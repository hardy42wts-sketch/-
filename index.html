<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f9d58">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f3;}
.header {background:linear-gradient(135deg,#0f9d58,#34a853);color:white;padding:25px;border-radius:0 0 25px 25px;}
.balance {font-size:34px;font-weight:bold;}
.list {padding:15px;}
.item {background:white;padding:15px;border-radius:15px;margin-bottom:10px;display:flex;justify-content:space-between;}
.amount.income{color:#0f9d58;} .amount.expense{color:#d93025;}
.fab {position:fixed;bottom:20px;right:20px;background:#0f9d58;color:white;width:65px;height:65px;border-radius:50%;font-size:30px;border:none;}
.modal {position:fixed;bottom:0;width:100%;background:white;padding:20px;display:none;border-radius:25px 25px 0 0;}
.modal input, .modal select {width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ddd;}
.modal button {width:100%;padding:12px;background:#0f9d58;color:white;border:none;border-radius:10px;}
</style>
</head>

<body>

<div class="header">
  <div>ยอดเงินคงเหลือ</div>
  <div class="balance" id="balance">0</div>
</div>

<div class="list" id="list"></div>
<canvas id="chart"></canvas>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <input id="desc" placeholder="รายละเอียด"><br>
  <input id="amount" type="number" placeholder="จำนวนเงิน"><br>

  <select id="type">
    <option value="income">รายรับ</option>
    <option value="expense">รายจ่าย</option>
  </select>

  <select id="category">
    <option value="อาหาร">อาหาร 🍜</option>
    <option value="เดินทาง">เดินทาง 🚗</option>
    <option value="เงินเดือน">เงินเดือน 💵</option>
    <option value="ผ่อนรถ">ผ่อนรถ 🛵</option>
     <option value="ผ่อนมือถือ">ผ่อนมือถือ 📱</option>
     <option value="งานนอก">งานนอก 💴</option>
    <option value="ค่าห้อง">ค่าห้อง 🏢</option>
    <option value="หนี้สิน 💸">หนี้สิน </option>
    <option value="อื่นๆ">อื่นๆ</option>
  </select>

  <button onclick="addTransaction()">บันทึก</button>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("data")) || [];
let chart;

function save(){
  localStorage.setItem("data", JSON.stringify(transactions));
}

function addTransaction(){
  const desc=document.getElementById('desc').value;
  const amount=document.getElementById('amount').value;
  const type=document.getElementById('type').value;
  const category=document.getElementById('category').value;

  if(!desc||!amount) return alert("กรอกข้อมูล");

  transactions.unshift({
    id:Date.now(),
    desc,
    amount:+amount,
    type,
    category,
    date:new Date()
  });

  save();
  render();
  document.getElementById('modal').style.display='none';
}

function deleteItem(id){
  transactions = transactions.filter(t=>t.id!==id);
  save();
  render();
}

function render(){
  let balance=0;
  const list=document.getElementById('list');
  list.innerHTML='';

  transactions.forEach(t=>{
    balance += t.type==='income'?t.amount:-t.amount;

    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`
      <div>
        <strong>${t.desc}</strong><br>
        <small>${t.category}</small>
      </div>
      <div class="amount ${t.type}">
        ${t.type==='income'?'+':'-'}${t.amount}
        <br><button onclick="deleteItem(${t.id})">❌</button>
      </div>
    `;
    list.appendChild(div);
  });

  document.getElementById('balance').innerText=balance;
  renderChart();
}

function renderChart(){
  const monthly={};

  transactions.forEach(t=>{
    const m=new Date(t.date).toLocaleString('th-TH',{month:'short'});
    if(!monthly[m]) monthly[m]={income:0,expense:0};

    if(t.type==='income') monthly[m].income+=t.amount;
    else monthly[m].expense+=t.amount;
  });

  const labels=Object.keys(monthly);
  const incomeData=labels.map(m=>monthly[m].income);
  const expenseData=labels.map(m=>monthly[m].expense);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'รายรับ',data:incomeData},
        {label:'รายจ่าย',data:expenseData}
      ]
    }
  });
}

function openModal(){
  document.getElementById('modal').style.display='block';
}

render();
</script>

</body>
</html>
